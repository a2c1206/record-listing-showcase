  toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

function copyText(text, btn, label) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const oldText = btn.innerText;
    btn.innerText = '✓ コピー完了';
    showToast(`${label}をコピーしました！`);
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerText = oldText;
    }, 1800);
  }).catch(err => {
    alert('コピーに失敗しました: ' + err);
  });
}

// ★ クリップボードへ画像をコピーする関数 ★
async function copyImageToClipboard(photoName, btn) {
  const origBtnText = btn.innerHTML;
  btn.innerText = '⏳ コピー中...';

  try {
    let dataUrl = window.RECORD_IMAGES && window.RECORD_IMAGES[photoName];
    if (!dataUrl) {
      // フォールバック: edited フォルダから直接ロード
      dataUrl = 'edited/' + photoName;
    }

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = dataUrl;
    await img.decode();

    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(b => {
        if (b) resolve(b);
        else reject(new Error('Canvas toBlob failed'));
      }, 'image/png');
    });

    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': blob })
    ]);

    btn.classList.add('copied');
    btn.innerText = '✓ コピー完了！';
    showToast(`画像をコピーしました！Yahoo!フリマで [Cmd + V] してください`);
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = origBtnText;
    }, 2000);
  } catch (err) {
    console.error('Image copy error:', err);
    btn.innerText = '✕ 失敗';
    alert('画像のコピーに失敗しました。ブラウザのセキュリティ設定により制限されている可能性があります。直接画像をドラッグ＆ドロップするか、画像を右クリックして「画像をコピー」をお試しください。\n詳細: ' + err.message);
    setTimeout(() => {
      btn.innerHTML = origBtnText;
    }, 2000);
  }
}

function openModal(photoName) {
  const dataUrl = (window.RECORD_IMAGES && window.RECORD_IMAGES[photoName]) || ('edited/' + photoName);
  document.getElementById('modalImg').src = dataUrl;
  document.getElementById('imageModal').classList.add('active');
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function copyItemField(id, isSet, field, btn, label) {
  let item = null;
  if (isSet) {
    item = setsData.find(s => s.id === id);
  } else {
    item = itemsData.find(it => it.id === parseInt(id));
  }
  if (!item) return;

  let text = '';
  if (field === 'title') text = item.listing_title;
  else if (field === 'desc') text = item.listing_description;
  else if (field === 'price') text = String(item.price);

  copyText(text, btn, label);
}

function setTab(btn, tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  render();
}

function render() {
  const container = document.getElementById('itemsGrid');
  container.innerHTML = '';

  let list = [];

  if (currentTab === 'sets') {
    list = setsData.map(s => Object.assign({}, s, { isSet: true }));
  } else {
    list = itemsData.filter(item => {
      if (currentTab === 'solo') return item.is_recommended_solo;
      if (currentTab === 'stones') return item.artist.indexOf('Rolling Stones') !== -1;
      if (currentTab === 'rod') return item.artist.indexOf('Rod Stewart') !== -1;
      if (currentTab === 'classic') return item.category.indexOf('クラシック') !== -1;
      if (currentTab === 'beatles') return (item.artist.indexOf('Lennon') !== -1 || item.artist.indexOf('Harrison') !== -1 || item.artist.indexOf('McCartney') !== -1 || item.artist.indexOf('Beatles') !== -1);
      if (currentTab === 'soul') return (item.category.indexOf('ソウル') !== -1 || item.category.indexOf('R&B') !== -1 || item.category.indexOf('ディスコ') !== -1 || item.category.indexOf('ファンク') !== -1);
      return true;
    }).map(it => Object.assign({}, it, { isSet: false }));
  }

  if (searchQuery) {
    list = list.filter(item => {
      const target = (item.title || item.name || '') + ' ' + (item.artist || '') + ' ' + (item.code || '');
      return target.toLowerCase().indexOf(searchQuery) !== -1;
    });
  }

  if (list.length === 0) {
    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">該当するレコードが見つかりませんでした。</div>';
    return;
  }

  list.forEach(item => {
    const isDone = !!doneItems[item.id];
    const isSet = item.isSet;
    const isHighValue = isSet || item.is_recommended_solo;

    const titleText = item.listing_title;
    const descText = item.listing_description;
    const price = item.price;
    const fee = Math.floor(price * 0.05);
    const takeHome = price - fee - 850;

    const card = document.createElement('div');
    card.className = 'card' + (isHighValue ? ' high-value' : '') + (isDone ? ' is-done' : '');

    const catBadge = isSet ? ('セット売り (' + item.count + '枚)') : item.category;
    const dispTitle = isSet ? item.name : item.title;

    // 写真プレビューHTMLの生成
    const photos = item.photos || [];
    let photosHtml = '';
    if (photos.length > 0) {
      const thumbsHtml = photos.map((p, idx) => {
        const label = idx === 0 ? 'ジャケット表' : (idx === 1 ? '裏面' : '付属品・内袋');
        const imgSrc = (window.RECORD_IMAGES && window.RECORD_IMAGES[p]) || ('edited/' + p);
        return `
          <div class="photo-thumb-card">
            <img src="${imgSrc}" loading="lazy" alt="${p}" title="クリックで拡大 / ドラッグ可能" onclick="openModal('${p}')">
            <span class="photo-thumb-label">${label}</span>
            <button class="btn-copy-img" onclick="copyImageToClipboard('${p}', this)">
              📋 画像コピー
            </button>
          </div>
        `;
      }).join('');

      photosHtml = `
        <div class="photos-container">
          <div class="photos-header">
            <span>📷 レコード写真 (${photos.length}枚)</span>
            <span style="color: #888; font-weight: normal;">※クリックで拡大 / ボタンでコピー</span>
          </div>
          <div class="photos-list">
            ${thumbsHtml}
          </div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="card-header">
        <div>
          <span class="tag-category">${catBadge}</span>
          <div class="card-title">${dispTitle}</div>
          <div class="card-artist">${item.artist}</div>
        </div>
        <label class="done-toggle">
          <input type="checkbox" ${isDone ? 'checked' : ''} onchange="saveDone('${item.id}', this.checked)">
          出品済
        </label>
      </div>

      <div class="card-body">
        <!-- 写真＆画像コピー -->
        ${photosHtml}

        <div class="info-row">
          <span class="info-label">推奨出品価格 (手取り試算)</span>
          <span class="price-tag">¥${price.toLocaleString()}</span>
        </div>
        <div class="fee-hint">PayPay手数料5%: -¥${fee.toLocaleString()} ｜ 宅急便80目安: -¥850 ｜ <strong>純手取り約 ¥${takeHome.toLocaleString()}</strong></div>

        <!-- タイトルコピー -->
        <div class="copy-group">
          <div class="copy-group-label">
            <span>出品用商品タイトル</span>
            <button class="btn-copy" onclick="copyItemField('${item.id}', ${isSet}, 'title', this, 'タイトル')">タイトルコピー</button>
          </div>
          <div class="copy-val">${titleText}</div>
        </div>

        <!-- 価格コピー -->
        <div class="copy-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
          <span style="font-size: 12px; font-weight: bold;">販売価格: ¥${price.toLocaleString()}</span>
          <button class="btn-copy" onclick="copyItemField('${item.id}', ${isSet}, 'price', this, '販売価格')">価格コピー (${price})</button>
        </div>

        <!-- 説明文コピー -->
        <div class="copy-group">
          <div class="copy-group-label">
            <span>商品説明文（試聴なし・ジャンク・免責文言組込済）</span>
            <button class="btn-copy" onclick="copyItemField('${item.id}', ${isSet}, 'desc', this, '説明文')">説明文コピー</button>
          </div>
          <div class="copy-val">${descText}</div>
        </div>

        <button class="btn-copy-main" onclick="copyItemField('${item.id}', ${isSet}, 'desc', this, '商品説明文')">
          📋 商品説明文を一括コピー
        </button>
      </div>
    `;

    container.appendChild(card);
  });
}

render();
</script>
